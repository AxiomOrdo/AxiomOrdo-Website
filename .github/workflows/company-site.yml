name: Company Site Gate

on:
  pull_request:
    paths:
      - "src/**"
      - "apps/aopdf/app/**"
      - "apps/aopdf/components/breadcrumbs.tsx"
      - "apps/aopdf/components/legal-document-page.tsx"
      - "public/**/*.html"
      - "index.html"
      - "public/samples/**"
      - "public/architecture-v2/**"
      - "scripts/generate-google-start-samples.mjs"
      - "scripts/prerender-architecture.mjs"
      - "scripts/breadcrumbs.mjs"
      - "tests/breadcrumb*.mjs"
      - "tests/csp-data-scripts.test.mjs"
      - "tests/google-start-website.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/company-site.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "apps/aopdf/app/**"
      - "apps/aopdf/components/breadcrumbs.tsx"
      - "apps/aopdf/components/legal-document-page.tsx"
      - "public/**/*.html"
      - "index.html"
      - "public/samples/**"
      - "public/architecture-v2/**"
      - "scripts/generate-google-start-samples.mjs"
      - "scripts/prerender-architecture.mjs"
      - "scripts/breadcrumbs.mjs"
      - "tests/breadcrumb*.mjs"
      - "tests/csp-data-scripts.test.mjs"
      - "tests/google-start-website.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/company-site.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --ignore-scripts
        working-directory: apps/aopdf
      - run: npx playwright install --with-deps chromium
        working-directory: apps/aopdf
      - run: npm run build
      - run: npm run test:google-start
      - name: Verify initial HTML breadcrumbs and safe serialization
        run: node --test tests/breadcrumbs.test.mjs tests/breadcrumb-rendering.test.mjs tests/csp-data-scripts.test.mjs
      - name: Verify breadcrumb desktop and mobile browser behavior
        run: node --test tests/breadcrumbs.browser.test.mjs
